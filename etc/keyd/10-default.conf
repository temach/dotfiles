# panic kill sequence *<backspace>+<escape>+<enter>* will force keyd to terminate
# see: https://github.com/rvaiya/keyd/blob/master/docs/keyd.scdoc
[ids]
# to get ids use * and run "sudo keyd" it will print ids of possible matching input devices
# 0001:0001:a38e6885
# 0001:0001:70533846
*

[main]
leftcontrol = esc

capslock = layer(control)

# remap copilot key, see https://github.com/rvaiya/keyd/issues/825 (to resize fonts with one hand using -/+ keys)
leftmeta+leftshift+f23 = layer(control)

leftmeta+leftshift+s = tab

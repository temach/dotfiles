[main]
capslock = layer(control)
# transform meta into ctrl to resize window with one hand using -/+ keys
meta = layer(mylayer)

[mylayer]
# left meta key always emits "leftmeta" in "sudo keyd monitor"
# right meta key always emits "leftmeta + leftshift"
# must undo shift keypress otherwise shift STAYS on for emitted keys
shift = noop
# browsers already use ergonomic "ctrl" + "=" to zoom in, terminator needed keybindings adjusted
# pressing = emits "ctrl" + "="
= = C-=
# pressing - emits "ctrl" + "-"
- = C--
